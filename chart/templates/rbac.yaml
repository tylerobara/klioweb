{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "klioweb.name" . }}-{{ .Release.Namespace }}
  labels: {{- include "klioweb.labels" . | nindent 4 }}
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: [clusters, backups, scheduledbackups]
    verbs: [get, list]
  - apiGroups: ["klio.cnpg.io"]
    resources: [pluginconfigurations, servers]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "klioweb.name" . }}-{{ .Release.Namespace }}
  labels: {{- include "klioweb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "klioweb.name" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "klioweb.sa" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
