{{- if and .Values.notifications.enabled .Values.notifications.pushover.enabled (not .Values.notifications.pushover.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "klioweb.name" . }}-pushover
  namespace: {{ .Release.Namespace }}
  labels: {{- include "klioweb.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.notifications.pushover.appToken | quote }}
  user: {{ .Values.notifications.pushover.userKey | quote }}
{{- end }}
