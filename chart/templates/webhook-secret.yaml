{{- if and .Values.notifications.enabled .Values.notifications.webhook.url (not .Values.notifications.webhook.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "klioweb.name" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels: {{- include "klioweb.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.notifications.webhook.url | quote }}
{{- end }}
