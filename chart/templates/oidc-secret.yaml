{{- $o := .Values.oidc }}
{{- if and $o.enabled (not (and $o.existingSecret $o.existingSecretSessionKey)) }}
{{- $name := printf "%s-oidc-config" (include "klioweb.name" .) }}
{{- $session := $o.sessionSecret }}
{{- if not $session }}
{{- /* Generate once and keep it on later upgrades so logins survive them. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "session-secret") }}
{{- $session = index $existing.data "session-secret" | b64dec }}
{{- else }}
{{- $session = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "klioweb.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-secret: {{ $session | quote }}
  {{- if not $o.existingSecret }}
  client-secret: {{ $o.clientSecret | quote }}
  {{- end }}
{{- end }}
