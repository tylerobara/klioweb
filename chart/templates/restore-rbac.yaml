{{- if .Values.restore.enabled }}
{{- $fullname := include "klioweb.name" . }}
{{- $sa := include "klioweb.sa" . }}
{{- $ns := .Release.Namespace }}
{{- $labels := include "klioweb.labels" . }}
{{- /* Write access to restore into each listed namespace, and nowhere else. */ -}}
{{- range .Values.restore.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-restore
  namespace: {{ . }}
  labels: {{- $labels | nindent 4 }}
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: [clusters]
    verbs: [create, delete]
  - apiGroups: ["klio.cnpg.io"]
    resources: [pluginconfigurations]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-restore
  namespace: {{ . }}
  labels: {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-restore
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
{{- end }}
---
{{- /* Results are stored as ConfigMaps in klioweb's own namespace. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-results
  namespace: {{ $ns }}
  labels: {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-results
  namespace: {{ $ns }}
  labels: {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-results
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
{{- end }}
