apiVersion: v1
kind: Service
metadata:
  name: {{ include "klioweb.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "klioweb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "klioweb.selector" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
